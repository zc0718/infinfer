# One kernel = a name + the (dtype, quant) pairs it is instantiated for + per-tier
# implementation status + whether a backward pass exists. This file is the single
# source of legal combinations: template instantiation, the census gate,
# parity stubs and the documentation table are all derived from it. A second
# hand-written list anywhere in the tree is a defect.
#
# `kernels` are bodies that exist as kernels: they see (pointer, length, dtype,
# quant) and nothing else. `composed` are operators the graph layer builds
# out of those kernels; they have no body of their own, so declaring them as
# kernels would put cells in the census that can never be filled. Every entry in
# `composed` has to name the kernels it uses, and a graph-level KAT has to exercise
# it -- that is where conv2d is judged, not in a per-kernel parity test.
#
# dtype tokens: fp32 | int8 | int16 | u8 | i32
# quant tokens: none | tensor | channel
# tier tokens:  scalar | autovec | arm_neon | arm_m | rvv
# tier/grad status: todo | done | na | no-grad
#
# A `tiers` entry takes one of two forms:
#   <tier>: <status>              a kernel-level claim: it applies to every
#                                 declared (dtype, quant) pair
#   <tier>: {<dtype>/<quant>: <status>, ...}
#                                 a per-pair claim: it must name exactly the
#                                 kernel's declared pairs (the census gate
#                                 rejects a missing pair as well as an unknown
#                                 key, so neither a typo nor an omission can be
#                                 read as a status)
# The second form exists because a tier can be real for one pair and absent for
# another: `arm_m` is a DSP dot product, so int8 has one and fp32 has no FPU on
# the Cortex-M profile (workspace/audit/gaps.md G-48/G-51). Writing the first
# form where the pairs differ is how a matrix starts lying.
#
# `done` is a claim: the census gate requires a test name for every `done` cell and
# turns red when one is missing. `todo` is a backlog item: it is reported as
# pending and does not fail the gate (`--strict` promotes it at release time).
# Only write `done` after the parity test exists and passes.
schema: 1
kernels:
  relu:
    tflite: [RELU]
    onnx: [{op: Relu}]
    dtype_quant: [[fp32, none], [int8, none]]
    # Per-pair (gaps G-51): the NEON row is the fp32 select; int8/none has no NEON
    # row yet. A flat `done` would claim it.
    tiers:
      scalar: done
      autovec: na
      # Per-pair: two declared pairs, one built -- a flat `done` would claim int8/none.
      x86: { fp32/none: done, int8/none: done }
      arm_neon: { fp32/none: done, int8/none: done }
      # Per-pair: the DSP extension does have 8-bit SIMD ops, so int8 has a real
      # lever (`SADD8` sets the GE flags per byte, `SEL` picks by them); fp32 has
      # none on a nofp profile (gaps G-79).
      arm_m: { fp32/none: na, int8/none: done }
      rvv: { fp32/none: done, int8/none: done }
    grad: todo
  fc:
    tflite: [FULLY_CONNECTED]
    onnx: [{op: Gemm}, {op: MatMul}]
    dtype_quant: [[fp32, none], [int8, tensor], [int16, tensor]]
    # Per-pair on purpose (gaps G-51): the DSP path is the dot product, and it
    # exists for both quantized element types -- int8 with packed lanes, int16
    # natively (`SMLALD` into a 64-bit accumulator), which is the shape the
      # extension was designed for.
      #
      # fp32/arm_m is `na`, decided 2026-11-26 (gaps G-79): the board profiles in
      # this matrix build with the `thumb/v7e-m/nofp` multilib, so fp32 there is
      # soft-float and a hand-written body has no instruction to reach for. The one
      # lever the M7 has is scalar FMA, and using it changes the rounding of a
      # reduction -- a different function, not a faster implementation of this one.
    tiers:
      scalar: done
      autovec: na
      # Per-pair for the same reason as the tiers below: this kernel declares three
      # pairs, so a flat `done` would claim the two quantized ones as well.
      x86: { fp32/none: done, int8/tensor: done, int16/tensor: done }
      # Per-pair (gaps G-51): the NEON row is the fp32 dot product. The quantized
      # pairs stay open -- int8 has a DSP path on Cortex-M and no NEON row yet, and a
      # flat `done` here would claim them.
      arm_neon: { fp32/none: done, int8/tensor: done, int16/tensor: done }
      arm_m: { fp32/none: na, int8/tensor: done, int16/tensor: done }
      rvv: { fp32/none: done, int8/tensor: done, int16/tensor: done }
    grad: todo
  # The two cells a quantized convolution needs and `fc` cannot supply: `fc` requantizes inside the
  # same call, so there is nowhere to put a bias. `dot` stops at the int32 accumulator, `requant`
  # adds the bias and rounds once. Both declare an empty tflite/onnx claim on purpose -- no
  # front-end operator maps to either cell, and borrowing conv2d's claim would give that op two
  # claimants with no `where` (R4).
  #
  # 量化卷积需要、而 `fc` 给不了的两个格：`fc` 在同一次调用里就再量化，偏置无处可放。
  # `dot` 停在 int32 累加器，`requant` 加偏置并只舍入一次。两者的 tflite/onnx 声明都**故意**
  # 为空——没有前端算子映射到这两格，而借用 conv2d 的声明会让那个算子有两个无 `where` 的
  # 主张方（R4）。
  dot:
    tflite: []
    onnx: []
    dtype_quant: [[int8, tensor]]
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: done, rvv: done }
    grad: no-grad
    grad_why: >-
      the output is an exact int32 accumulator, so a derivative would have to be defined by
      whatever quantization scheme surrounds it -- a graph-layer decision, the same reason
      `quantize` is no-grad
  requant:
    tflite: []
    onnx: []
    dtype_quant: [[i32, tensor]]
    # No per-tier vector body, and that is a measured decision, not an omission:
    # the operator is called once per output element in the only pipeline that
    # uses it, so 3.47 ns of every element is the call itself and 1.42 ns is the
    # arithmetic (gaps G-121). A vector body cannot remove the calls, and it
    # would have to reproduce the double-domain rounding bit for bit -- a second
    # definition of rounding for a share of the cost that is already smaller than
    # the call overhead. The lever, if precision review ever allows it, is a
    # fixed-point multiplier (a numeric-semantics change), not a tier cell.
    #
    # 不写逐档向量体，这是量出来的决定：唯一使用它的流水线是每个输出元素调一
    # 次，每元素的 3.47 ns 里调用本身就是大头，算术只有 1.42 ns（gaps G-121）。
    # 向量体去不掉调用，还要逐位复现 double 域的舍入——为一个已经小于调用开销的
    # 份额再写一份舍入定义。若将来精度评审允许，杠杆是定点乘子（改数值语义），不
    # 是一个档位格。
    tiers: { scalar: done, autovec: na, x86: na, arm_neon: na, arm_m: na, rvv: na }
    grad: no-grad
    grad_why: >-
      round-and-saturate is a step function: a gradient needs a straight-through estimator, and
      where to pretend the step is linear is the same graph-layer decision `quantize` records
  quantize:
    tflite: [QUANTIZE]
    onnx: [{op: QuantizeLinear}]
    dtype_quant: [[fp32, tensor]]
    # `arm_neon` is `na` for two reasons that both have to be written down.
    # First, the reference divides and AArch32 NEON has no IEEE float divide, so a
    # reciprocal body would be a different function -- and the claim is per tier,
    # not per build (src/kernel/arm_neon/quant.c, gaps G-77). Second, the tier now
    # belongs to the vendor-backend domain: ADR-007 puts `arm_neon` on the SoC
    # side, where XNNPACK supplies the kernels, so a hand-written body here would
    # be a new SoC vector cell that buys nothing. Cells already `done` stay: they
    # are the fallback and the parity oracle.
    #
    # `arm_neon` 记 `na`，两条理由都要写下来：其一，参考实现做除法，而 AArch32
    # NEON 没有 IEEE 除法，倒数的体是另一个函数，而主张是按档、不是按构建（gaps
    # G-77）；其二，这一档已归入厂商后端域——ADR-007 把 `arm_neon` 划到 SoC 侧，
    # 内核由 XNNPACK 提供，此时手写体买不到任何东西。已 `done` 的格保留：它们是
    # 后备与 parity oracle。
    tiers: { scalar: done, autovec: na, arm_neon: na, arm_m: na, rvv: done }
    grad: no-grad
    grad_why: >-
      quantisation is a step function, so a derivative needs a straight-through estimator,
      and where to pretend the step is linear is a graph-layer decision (PLAN P6), not one
      this kernel can make on its own
  dequantize:
    tflite: [DEQUANTIZE]
    onnx: [{op: DequantizeLinear}]
    dtype_quant: [[int8, tensor]]
    tiers: { scalar: done, autovec: na, arm_neon: done, arm_m: na, rvv: done }
    grad: no-grad
    grad_why: >-
      the same step function in reverse: attributing a gradient to a quantised code is the
      same straight-through decision as quantize, made once at the graph layer
  add:
    tflite: [ADD]
    onnx: [{op: Add}]
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: na, rvv: done }
    grad: todo
  mul:
    tflite: [MUL]
    onnx: [{op: Mul, where: "both operands are tensors of the same shape"}]
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: na, rvv: done }
    grad: todo
  # The fused depthwise window. It exists because expressing a depthwise convolution
  # as one `fc` per output element made the **call** the dominant cost: 18.6 ns of
  # fixed cost against 36.7 ns total, i.e. half the time was the call (gaps G-129).
  # Batching the channels of one output pixel into a single call removes 127 of every
  # 128 calls, and the inner dimension stays fixed by the kernel identity, so INV-3
  # holds without a shape in the signature.
  #
  # Every vector tier is `na` on purpose: the win here is the call count, not the tap
  # sum, and ISA-level work on those tiers belongs to the vendor backend (ADR-007).
  # `arm_m` has no fp32 at all on the no-FPU profile, same as the other fp32 cells.
  #
  # 融合的深卷积窗口。它存在的原因是：把深卷积写成「每个输出元素一次 `fc`」之后，**调用**
  # 成了主要成本——每次调用 18.6 ns 固定开销、每次总共只有 36.7 ns，即一半时间花在调用上
  # （gaps G-129）。把一个输出像素的所有通道批进一次调用，就能去掉 128 次里的 127 次，而
  # 内维由内核身份固定，所以 INV-3 的「签名里没有形状」仍然成立。
  #
  # 向量档全部记 `na` 是故意的：这里的收益是**调用次数**而不是抽头求和，而那些档的 ISA 层
  # 工作属于厂商后端（ADR-007）。`arm_m` 在无 FPU 的档上根本没有 fp32，与其它 fp32 格一致。
  # The data-movement primitive the layout operators are built on. No front-end operator maps
  # to it directly, so both claims are empty on purpose -- the same arrangement `dot` and
  # `requant` use. Only the reference tier is declared: a copy is memory-bound and the body is
  # already `memcpy`, so a vector body would be the same instruction with more code around it
  # (ADR-007). The `scalar` cell is the best implementation here, not the fallback.
  #
  # 布局类算子所依赖的搬运原语。没有前端算子直接映射到它，所以两条主张都故意为空——与
  # `dot`、`requant` 同一安排。只声明参考档：拷贝是内存受限的，体本身就是 `memcpy`，手写
  # 向量体只会得到同一条指令外加更多周边代码（ADR-007）。这一格的 `scalar` 是最优实现，
  # 不是后备。
  copy:
    tflite: []
    onnx: []
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: na, arm_neon: na, arm_m: na, rvv: na }
    grad: no-grad
    grad_why: >-
      a copy is the identity on values, so a derivative would be the identity too; spending a
      contract on saying that is worse than saying nothing
  # The two primitives stable softmax is built from. `exp` is declared scalar-only because `expf`
  # is a libm call: a hand-written vector body would either repeat that call in a loop or carry a
  # polynomial with its own accuracy contract, and the second belongs to a vendor backend
  # (ADR-007). `shift` exists because subtracting a constant is the numerical guard softmax and
  # layer normalisation both need, and neither has an activation to hang it on -- keeping it a
  # kernel is what lets those operators contain no arithmetic of their own.
  #
  # 稳定 softmax 用到的两个原语。`exp` 只声明 scalar 档，因为 `expf` 是一次 libm 调用：手写向量体
  # 要么把同一个调用套进循环，要么自带一份精度契约的多项式，而后者属于厂商后端（ADR-007）。
  # `shift` 之所以存在，是因为减去一个常数是 softmax 与 layer normalization 都需要的数值护栏，
  # 而两者都没有可挂靠的激活——把它做成内核，才让那些算子里没有自己的算术。
  #
  # Both mappings are empty on purpose, like `copy`: these are primitives that composed operators
  # call, not front-end ops we claim to serve. Claiming `Exp` here would say a model containing a
  # standalone `Exp` node can run, which the importer does not translate -- `census_gate` exists to
  # catch exactly that sentence.
  #
  # 两条前端映射都故意为空，与 `copy` 一致：它们是组合算子调用的原语，不是我们声称支持的前端算子。
  # 在这里主张 `Exp` 就等于说「带独立 Exp 节点的模型能跑」，而导入器并不翻译它——`census_gate`
  # 存在的意义正是抓这句话。
  exp:
    tflite: []
    onnx: []
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: na, arm_neon: na, arm_m: na, rvv: na }
    grad: todo
  shift:
    tflite: []
    onnx: []
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: na, arm_neon: na, arm_m: na, rvv: na }
    grad: todo
  dwconv3x3:
    tflite: []
    onnx: []
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: na, arm_neon: na, arm_m: na, rvv: na }
    grad: no-grad
    grad_why: >-
      a depthwise window is a linear map like any convolution, so a derivative exists, but
      nothing in this library asks for one and inventing a contract here would be the same
      mistake `conv2d` avoided by staying composed
  sum:
    tflite: [SUM]
    onnx: [{op: ReduceSum}]
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: na, rvv: done }
    grad: todo
  scale:
    tflite: [MUL]
    onnx: [{op: Mul, where: "one operand is a scalar"}]
    dtype_quant: [[fp32, none]]
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: na, rvv: done }
    grad: todo
  max:
    tflite: [REDUCE_MAX]
    onnx: [{op: ReduceMax}]
    dtype_quant: [[fp32, none]]
    # Flat on purpose: the kernel declares one pair, so a kernel-level `done` claims
    # exactly that one pair and nothing else.
    tiers: { scalar: done, autovec: na, x86: done, arm_neon: done, arm_m: na, rvv: done }
    grad: no-grad
    grad_why: >-
      this reduce-max returns the value, not the index, so a subgradient has no target to
      route to; argmax routing needs the index-returning kernel, which is not declared here
composed:
  # A layout transform, not arithmetic: every input is a run of `copy` calls into a strided
  # window of the output. It is the first of the four layout operators G-136 measured as
  # missing (concat, slice, resize, transpose) and it exists as the proof that the pattern is
  # cheap to add: one kernel (`copy`) plus one loop over runs.
  #
  # 布局变换而非算术：每个输入是若干次 `copy` 调用，写进输出里一个带步长的窗口。它是
  # G-136 实测缺失的四个布局算子（concat、slice、resize、transpose）里的第一个，也用来
  # 证明这个模式加起来的代价很低：一个内核（`copy`）加一个按段的循环。
  #
  # `kat: pending` is honest, not an omission: the operator is judged today by
  # `GraphConcatF32/*` and by the call-count test, and the graph level chain that would put it
  # in a KAT blob is the next step. A `pending` here is the matrix saying so out loud.
  #
  # `kat: pending` 是诚实而不是遗漏：该算子今天由 `GraphConcatF32/*` 与调用计数测试判定，
  # 而把它放进 KAT blob 的图层链是下一步。这里的 `pending` 就是矩阵把这件事说出来。
  # The second layout transform, and the one that proves the cost model holds when no
  # contiguous run exists: NHWC to NCHW gathers into the workspace and still costs one call.
  #
  # 第二个布局变换，也是证明"输出顺序里没有连续段时代价模型仍成立"的那个：NHWC 转 NCHW
  # gather 进工作区，代价仍是一次调用。
  transpose:
    tflite: [TRANSPOSE]
    onnx: [{op: Transpose}]
    uses: [copy]
    kat: pending
  # The third layout transform. Its cost model is the one worth stating out loud: slicing the
  # channel axis of an NHWC tensor keeps the innermost axis contiguous, so the whole cut is one
  # `copy` per pixel rather than one per element -- and the case that breaks that (a strided
  # innermost axis) gathers once instead, exactly like `transpose`.
  #
  # 第三个布局变换。它的代价模型值得写明：切 NHWC 的通道轴时末轴仍然连续，所以整个切片是
  # 每像素一次 `copy` 而不是每元素一次；而破坏这一点的情形（末轴带步长）改走一次 gather，
  # 与 `transpose` 完全一致。
  slice:
    tflite: [SLICE]
    onnx: [{op: Slice}]
    uses: [copy]
    kat: pending
  # The fourth layout transform, and the one that pays the strided-read bill: a nearest resize
  # walks the output in order and moves a run of input elements whenever consecutive outputs land
  # on consecutive inputs. The integer upscale real models emit therefore costs one `copy` per
  # `scale` outputs, while a downscale degenerates to one per output -- stating the second half
  # matters, because it is the honest cost and not a defect of this implementation.
  #
  # 第四个布局变换，也是付「带步长的读」这一笔账的那个：最近邻缩放按输出顺序走输入，只要
  # 相邻输出落在相邻输入上就拼成一段 `copy`。真实模型用的整数上采样因此每 `scale` 个输出
  # 一次调用，而降采样退化成每输出一次——把后半句写出来很重要，那是诚实的代价，
  # 不是本实现的缺陷。
  #
  # Bilinear is not here yet and is not a flag on this row: it reads four neighbours per output,
  # so it needs the window arithmetic `conv2d` has (`fc` + `add`), not a `copy`. It gets its own
  # row when that increment lands.
  #
  # 双线性还不在这里，也不是这一行上的一个开关：它每个输出读四个邻点，需要 `conv2d` 那套
  # 窗口算术（`fc` + `add`），而不是 `copy`。等那一轮落地时它单独占一行。
  resize:
    tflite: [RESIZE_NEAREST_NEIGHBOR]
    onnx: [{op: Resize, where: "mode == nearest"}]
    uses: [copy]
    kat: pending
  # The reduction row's second member, and the first composed operator that needs numerical care
  # rather than only layout: the slice is gathered, its max subtracted, `exp`, `sum`, `scale` --
  # four registry calls plus one gather, so the slice's own arithmetic is entirely in kernels.
  #
  # 归约行的第二个成员，也是第一个需要数值处理而不只是布局的组合算子：取出切片、减去最大值、
  # `exp`、`sum`、`scale`——四次注册表调用加一次 gather，切片自己的算术全在内核里。
  softmax:
    tflite: [SOFTMAX]
    onnx: [{op: Softmax}]
    uses: [max, shift, exp, sum, scale]
    kat: pending
  concat:
    tflite: [CONCATENATION]
    onnx: [{op: Concat}]
    uses: [copy]
    kat: pending
  conv2d:
    tflite: [CONV_2D]
    onnx: [{op: Conv, where: "group == 1"}]
    uses: [fc, add]
    kat: graph_kat_k2_conv_micro
  dwconv2d:
    tflite: [DEPTHWISE_CONV_2D]
    onnx: [{op: Conv, where: "group == in_channels"}]
    uses: [fc, add]
    kat: graph_kat_k2_conv_micro
  max_pool2d:
    tflite: [MAX_POOL_2D]
    onnx: [{op: MaxPool}]
    uses: [max]
    kat: graph_kat_k2_conv_micro
  mean:
    tflite: [MEAN]
    onnx: [{op: ReduceMean}]
    uses: [sum, scale]
    kat: graph_kat_k2_conv_micro

